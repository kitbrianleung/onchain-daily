name: Trending x Smart Money
on:
  schedule:
    - cron: "0 4 * * *"        # 12:00 noon Hong Kong time (UTC+8) — between the two news posts
  workflow_dispatch: {}        # manual test button

permissions:
  contents: write

jobs:
  trending:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
      REASONING_EFFORT: low
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: npm install -g gmgn-cli
      - name: Fetch trending, filter smart money, render table
        run: python trending.py generate
      - name: Push images to repo
        run: |
          git config user.name "onchain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images/trending-story.jpg images/trending-post.jpg state/trending.json
          git commit -m "trending table $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
      - name: Publish story + post to Instagram
        run: python trending.py publish
