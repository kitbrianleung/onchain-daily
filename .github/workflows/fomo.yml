name: fomo

on:
  schedule:
    - cron: "30 4 * * *"       # 12:30pm Hong Kong time, right after the trending post
  workflow_dispatch: {}

permissions:
  contents: write               # needed to push images/fomo/ back to the repo

jobs:
  fomo:
    runs-on: ubuntu-latest
    env:
      FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch FOMO boards, render tables + analysis
        run: python fomo_tables.py generate
      - name: Publish story to Instagram
        run: python fomo_tables.py publish
