name: Onchain Daily
on:
  schedule:
    - cron: "0 0 * * *"        # 08:00 Hong Kong time (UTC+8)
  workflow_dispatch: {}        # manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  onchain-daily:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      PANEWS_RSS: ${{ secrets.PANEWS_RSS }}
      BLOCKBEATS_API_KEY: ${{ secrets.BLOCKBEATS_API_KEY }}
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/images
      REASONING_EFFORT: low
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch news, pick top 5, render images
        run: python agent.py generate
      - name: Push images to repo (so Instagram can download them)
        run: |
          git config user.name "onchain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images state/news.json
          git commit -m "daily images $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
      - name: Publish story + feed post to Instagram
        run: python agent.py publish
      - name: Save used-article memory
        if: always()
        run: |
          git config user.name "onchain-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "state $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
